# Place gazetteer for deterministic entity extraction (app/services/entities.py).
#
# `communities`: African Nova Scotian communities. Source: Government of Nova Scotia Open Data,
#   "African Nova Scotian Family Names by Region" (https://data.novascotia.ca/d/kbzq-tfz7), fetched 2026-11-07,
#   column "African NS Communities in the Region", plus the historical settlements that recur in the catalogues
#   (Birchtown, Tracadie, Sunnyville, Lincolnville, Loch Lomond, Whitney Pier) and the Preston/Hammonds Plains variants.
# `places`: other places that recur in Black Nova Scotian / Black Canadian catalogue records (counties, towns,
#   provinces, countries and cities tied to the Loyalist, Refugee, Maroon and Sierra Leone migrations).
# Matching is whole-word and case-insensitive. Aliases map a variant to the canonical name on the left.

